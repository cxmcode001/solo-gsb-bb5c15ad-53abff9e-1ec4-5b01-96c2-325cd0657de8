services:
  webhook:
    build: .
    image: reliable-webhook:latest
    ports:
      - "8000:8000"
    environment:
      # Override this with a strong secret in real use, e.g. via .env:
      #   echo "WEBHOOK_SECRET=$(openssl rand -hex 32)" > .env
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-dev-secret-change-me}"
      WEBHOOK_DB_PATH: "/data/webhooks.db"
      WORKER_POLL_INTERVAL: "0.2"
      DELIVERY_TIMEOUT: "10"
    volumes:
      # Persists events, delivery attempts and dead-letter/replay state
      # (replay_count, last_replayed_at, deliver_after, expires_at).
      # Older databases are migrated in place on startup — the replay and
      # delivery-window columns are added automatically.
      - webhook-data:/data
    restart: unless-stopped

volumes:
  webhook-data:
